name: Bug Report
description: Report a reproducible bug
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (including error messages, stack traces)
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (blocking work)
        - Major (significant impact)
        - Minor (minor inconvenience)
        - Trivial (cosmetic/papercut)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: e.g., Node 22, Windows 11, Chrome 128
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Copy and paste any relevant log output
      render: shell
