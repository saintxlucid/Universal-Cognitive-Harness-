name: Feature Request
description: Suggest an idea for this project
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting a feature. Provide enough context so we can evaluate it.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? What is the user need?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed Solution
      description: What should happen? How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches have you considered?
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Cross-workspace (affects shared tooling)
        - Single project
        - External/integration
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, diagrams, references, or screenshots
