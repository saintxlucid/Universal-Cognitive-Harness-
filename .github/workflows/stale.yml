name: Stale Issue & PR Management

on:
  schedule:
    - cron: 0 8 * * 1
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: This issue has been inactive for 60 days. Remove the stale label or comment to keep it open.
          stale-pr-message: This PR has been inactive for 30 days. Remove the stale label or push new changes to keep it active.
          close-issue-message: This issue was closed automatically after 14 days of inactivity.
          close-pr-message: This PR was closed automatically after 14 days of inactivity.
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,blocked
          exempt-pr-labels: blocked,do-not-merge
          operations-per-run: 100
          enable-statistics: true
